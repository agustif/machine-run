name: CI

# Kept deliberately honest: no `continue-on-error`, no step skipped to make a
# red run look green. If a job is red, the repo is red — that is the point of
# running it at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci`, not `npm install`: it installs the committed lockfile
      # exactly and fails if package.json and the lockfile disagree. Letting
      # CI re-resolve means it tests a dependency graph nobody ran locally,
      # which is how a second copy of `effect` reached a runner and produced a
      # `NodeInspectSymbol` type mismatch that reproduced nowhere else.
      - run: npm ci

      # `npm ci` runs postinstall, which applies patches/. This asserts the
      # result independently: a patch that stops applying must fail the build
      # loudly rather than leaving an unpatched dependency in place.
      - name: patches apply
        run: npm run patches:check

      - name: tsc -b
        run: npm run build

      - name: vitest
        run: npm test

      # Lint once rather than per-OS: it reads source, not the machine.
      - name: oxlint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

  # Windows gets its own job because it verifies strictly less, and the job
  # name should say so rather than a green `check (windows-latest)` implying
  # the suite passes there. It does not: tests still fail on Windows for two
  # remaining reasons, enumerated in docs/TASKS.md under "Windows" — POSIX modes
  # are not representable, and `chmod 0o000` does not make a directory
  # unreadable, so three fixtures cannot express an invariant that is itself
  # correct. A third cause, `snapshotBeforeApply` silently taking no backup at
  # all, turned out to be a real bug and is fixed (see `mirrorSegments` in
  # core/src/Backups.ts).
  #
  # Type-checking on Windows is still worth a runner of its own: it is
  # platform-independent, and it is what caught a second copy of `effect`
  # reaching one OS's install and nowhere else.
  typecheck-windows:
    name: typecheck (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: tsc -b
        run: npm run build

  # ---------------------------------------------------------------------
  # Verification jobs: run the real tools this repo parses, on a machine
  # that actually has them. Each one closes a gap that is currently marked
  # "unverified" in a backend's doc comment and in docs/TASKS.md.
  # ---------------------------------------------------------------------

  verify-windows:
    name: verify winget / choco / icacls parsers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      # `--accept-source-agreements` is not optional: without it `winget list`
      # exits 1 on a machine that has never accepted the `msstore` source's
      # terms, which is every fresh machine and every CI runner. Verified here —
      # this step failed exactly that way before the flag was added, which
      # confirms the flag our Winget backend already passes is required rather
      # than defensive.
      - name: Capture real winget output
        shell: pwsh
        run: |
          winget --version | Tee-Object -FilePath winget-version.txt
          winget list --accept-source-agreements --disable-interactivity | Tee-Object -FilePath winget-list.txt
      - name: Capture real choco output
        shell: pwsh
        run: |
          choco --version | Tee-Object -FilePath choco-version.txt
          choco list --local-only --limit-output | Tee-Object -FilePath choco-list.txt

      # docs/notes/windows-permissions.md is the research trail this step
      # closes the loop on: `packages/core/src/windows/Icacls.ts`'s parser is
      # pinned against two real, but externally captured, `icacls`
      # transcripts (a public mailing-list attachment, not this repo's own
      # output). This is the other half — real `icacls` output from this
      # repo's own Windows runner, on a file created just for this. The path
      # is written to `$GITHUB_ENV` because it is only known at runtime
      # (`$env:RUNNER_TEMP` varies per runner) and the assertion step below
      # needs the exact string `icacls` was invoked with — it appears
      # verbatim as the first line's prefix in the captured output, and
      # `parseIcacls` cannot recover it by guessing where whitespace splits a
      # path from a principal name.
      - name: Capture real icacls output
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "machine-run-icacls-test.txt"
          Set-Content -Path $target -Value "probe"
          Add-Content -Path $env:GITHUB_ENV -Value "MACHINE_RUN_ICACLS_PATH=$target"
          icacls $target | Tee-Object -FilePath icacls-listing.txt

      # Asserted here rather than uploaded for a human to read later. Uploading
      # was the original design and it was the weaker one twice over: it made
      # this job depend on the account's artifact storage quota (which it then
      # hit, failing a job whose commands had all succeeded), and it verified
      # nothing on its own — someone still had to download the files and
      # compare by hand.
      #
      # The captured output already paid for itself once. It showed that winget
      # truncates an over-long cell with an ellipsis that eats the column
      # padding, so the old parser's "split on 2+ spaces" merged Id and Version
      # on 9 of 64 rows. That fixture now lives in
      # packages/system-packages/test/fixtures and pins the fix. What this step
      # adds is the other direction: noticing if winget or choco changes its
      # format, which a frozen fixture never can.
      # `tsc -b` first: every package's `exports` map points at `lib/`, so a
      # cross-package import does not resolve from a bare `npm ci` checkout.
      - name: tsc -b
        run: npm run build

      - name: Assert the parsers against that output
        env:
          MACHINE_RUN_WINGET_LIST: winget-list.txt
          MACHINE_RUN_CHOCO_LIST: choco-list.txt
        run: npx vitest run packages/system-packages/test/windowsLive.test.ts

      # `MACHINE_RUN_ICACLS_PATH` is already in this step's environment via
      # `$GITHUB_ENV`, set by the capture step above.
      - name: Assert the icacls parser against that output
        env:
          MACHINE_RUN_ICACLS_LISTING: icacls-listing.txt
        run: npx vitest run packages/core/test/windows/IcaclsLive.test.ts

  verify-macos:
    name: verify defaults / mas parsers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      # `defaults export | plutil -extract <key> xml1` is the read path
      # MacOS.Default depends on; this proves it against a real macOS rather
      # than only the developer's own machine.
      - name: Exercise the defaults read path
        run: |
          defaults write com.machine-run.citest sample -string 'a b'
          defaults export com.machine-run.citest - | plutil -extract sample xml1 -o - -
          defaults delete com.machine-run.citest

      - name: Capture mas surface
        continue-on-error: true
        run: brew install mas && mas version && mas list || echo "mas unavailable on this runner"

  verify-linux-backends:
    name: verify dnf / pacman parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Containers rather than the runner itself: the runner is Ubuntu, and
      # these two backends parse Fedora and Arch output specifically.
      - name: Fedora (dnf)
        run: |
          docker run --rm fedora:latest bash -lc "
            dnf --version | head -1
            dnf repoquery --userinstalled --qf '%{name}\n' | head -20
          "
      - name: Arch (pacman)
        run: |
          docker run --rm --platform linux/amd64 archlinux:latest bash -lc "
            pacman --version | head -2
            pacman -Qq | head -20
          "

  deploy-check:
    name: deploy (plan / idempotence / drift / destroy)
    runs-on: ubuntu-latest
    # The gap this repo has never closed: the engine has never executed. This
    # job is the only thing here that runs `alchemy plan` at all, so its
    # failure output is a deliverable in its own right.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: scripts/deploy-check.sh
        run: bash scripts/deploy-check.sh
